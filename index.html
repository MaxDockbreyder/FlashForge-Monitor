<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>FlashForge · Printer Status</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111211;
      --panel: #191a18;
      --panel-soft: #20211f;
      --line: #30312e;
      --text: #e8e9e5;
      --muted: #92958e;
      --green: #8fc7a0;
      --blue: #9db7df;
      --red: #e39a92;
      --amber: #d9bd7c;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .shell { width: min(1040px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 28px; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 24px;
    }
    h1 { font-size: 19px; font-weight: 600; letter-spacing: -.025em; margin: 0; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .header-actions { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
    .button {
      border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px;
      color: var(--text); background: var(--panel); cursor: pointer;
    }
    .button:hover { background: var(--panel-soft); }
    .button:disabled { opacity: .5; cursor: wait; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); min-width: 0; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 17px; }
    .printer-name { font-size: 15px; font-weight: 600; }
    .printer-ip { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
    .head-right { display: flex; align-items: center; gap: 10px; }
    .status { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; color: var(--muted); font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status.printing { color: var(--blue); }
    .status.ready { color: var(--green); }
    .status.error { color: var(--red); }
    .led { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 5px; padding: 5px 8px; cursor: pointer; font-size: 12px; }
    .led.on { color: var(--amber); border-color: #66583b; }
    .led:disabled { opacity: .45; cursor: not-allowed; }
    .thumb { height: 190px; display: flex; justify-content: center; align-items: center; background: #151614; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .thumb img { width: 100%; height: 100%; object-fit: contain; }
    .thumb-empty { color: var(--muted); font-size: 12px; }
    .body { padding: 17px; }
    .error { color: var(--red); background: #271c1a; border: 1px solid #4a2d29; padding: 10px 11px; border-radius: 5px; overflow-wrap: anywhere; }
    .job { color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-bottom: 17px; }
    .progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .section-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
    .percent { font-size: 14px; font-variant-numeric: tabular-nums; }
    .track { height: 5px; border-radius: 10px; background: #30312e; overflow: hidden; }
    .fill { height: 100%; background: #9db7df; transition: width .25s ease; }
    .layer { text-align: right; margin-top: 7px; color: var(--muted); font-size: 12px; }
    .stats, .temps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
    .stat, .temp { border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
    .stat-label, .temp-label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .stat-value { font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .temp-value { font-size: 17px; font-variant-numeric: tabular-nums; }
    .target { color: var(--muted); font-size: 12px; }
    .idle { color: var(--muted); padding: 8px 0 2px; }
    .camera-toggle { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); padding: 12px 17px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
    .camera-toggle:hover { color: var(--text); }
    .camera { display: none; border-top: 1px solid var(--line); background: #080908; }
    .camera.open { display: block; }
    .camera img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; }
    .camera-foot { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; font-size: 12px; color: var(--muted); }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 24px; }
    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 520px); padding-top: 22px; }
      header { align-items: flex-start; }
      .grid { grid-template-columns: 1fr; }
      .header-actions { flex-direction: column-reverse; align-items: flex-end; gap: 7px; }
      .thumb { height: 170px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>FlashForge</h1>
        <div class="subtitle">Printer status · AD5X and AD5M</div>
      </div>
      <div class="header-actions">
        <span>Refresh in <span id="countdown">30</span> s</span>
        <button class="button" id="refreshBtn" type="button">Refresh</button>
      </div>
    </header>

    <section class="grid" id="grid" aria-label="Printers">
      {% for p in printers %}
      <article class="card" id="card-{{ p.id }}">
        <div class="card-head">
          <div>
            <div class="printer-name">{{ p.name }}</div>
            <div class="printer-ip">{{ p.ip or 'IP not configured' }}</div>
          </div>
          <div class="head-right">
            <button class="led" id="ledBtn-{{ p.id }}" type="button" disabled>LED</button>
            <span class="status" id="pill-{{ p.id }}"><span class="dot"></span><span>Loading</span></span>
          </div>
        </div>
        <div id="thumb-{{ p.id }}"></div>
        <div class="body" id="body-{{ p.id }}">
          <div class="idle">Loading printer status…</div>
        </div>
        {% if p.camera_url %}
        <div class="camera" id="camPanel-{{ p.id }}"></div>
        <button class="camera-toggle" id="camToggle-{{ p.id }}" type="button" aria-expanded="false">
          <span>Camera</span><span>Open +</span>
        </button>
        {% endif %}
      </article>
      {% endfor %}
    </section>

    <footer>
      <span>FlashForge Monitor</span>
      <span>Last updated: <time id="lastUpdate">–</time></span>
    </footer>
  </main>

  <script>
    const printerConfig = {{ printers | tojson }};
    const ledStates = {};
    const cameraOpen = {};
    let countdown = 30;
    let countdownTimer = null;
    let refreshInProgress = false;

    const byId = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);

    function stateClass(state) {
      const s = String(state || '').toLowerCase();
      if (s.includes('print') || s.includes('building')) return 'printing';
      if (s.includes('idle') || s.includes('ready') || s.includes('finish')) return 'ready';
      if (s.includes('error') || s.includes('fail')) return 'error';
      return '';
    }

    function stateLabel(state, online, error) {
      if (error) return 'Error';
      if (!online) return 'Offline';
      const s = String(state || '').toLowerCase();
      if (s.includes('print') || s.includes('building')) return 'Printing';
      if (s.includes('pause')) return 'Paused';
      if (s.includes('finish')) return 'Finished';
      if (s.includes('idle') || s.includes('ready')) return 'Ready';
      return state || 'Unknown';
    }

    function renderThumbnail(d) {
      const el = byId(`thumb-${d.id}`);
      if (!d.online || (!d.thumbnail && stateClass(d.state) !== 'printing')) {
        el.innerHTML = '';
        return;
      }
      if (d.thumbnail) {
        el.innerHTML = `<div class="thumb"><img src="${escapeHtml(d.thumbnail)}" alt="Print preview"></div>`;
      } else {
        el.innerHTML = '<div class="thumb"><span class="thumb-empty">No preview available</span></div>';
      }
    }

    function buildTemps(d) {
      const rows = [];
      if (d.temp_nozzle !== null && d.temp_nozzle !== undefined) {
        rows.push(`<div class="temp"><div class="temp-label">Nozzle</div>
          <div class="temp-value">${Math.round(Number(d.temp_nozzle))} °C</div>
          ${d.temp_nozzle_target != null ? `<div class="target">Ziel ${Math.round(Number(d.temp_nozzle_target))} °C</div>` : ''}</div>`);
      }
      if (d.temp_bed !== null && d.temp_bed !== undefined) {
        rows.push(`<div class="temp"><div class="temp-label">Bed</div>
          <div class="temp-value">${Math.round(Number(d.temp_bed))} °C</div>
          ${d.temp_bed_target != null ? `<div class="target">Ziel ${Math.round(Number(d.temp_bed_target))} °C</div>` : ''}</div>`);
      }
      return rows.length ? `<div class="temps">${rows.join('')}</div>` : '';
    }

    function renderCard(d) {
      const card = byId(`card-${d.id}`);
      const pill = byId(`pill-${d.id}`);
      const body = byId(`body-${d.id}`);
      const led = byId(`ledBtn-${d.id}`);
      if (!card || !pill || !body) return;

      const cls = stateClass(d.state);
      const label = stateLabel(d.state, d.online, d.error);
      pill.className = `status ${d.error ? 'error' : (!d.online ? '' : cls)}`;
      pill.innerHTML = `<span class="dot"></span><span>${escapeHtml(label)}</span>`;

      if (led) {
        led.disabled = !d.online || Boolean(d.error);
        led.classList.toggle('on', d.lights_on === true || ledStates[d.id] === true);
        led.textContent = (d.lights_on === true || ledStates[d.id] === true) ? 'LED on' : 'LED';
        if (typeof d.lights_on === 'boolean') ledStates[d.id] = d.lights_on;
      }

      renderThumbnail(d);
      if (!d.online || d.error) {
        body.innerHTML = `<div class="error">${escapeHtml(d.error || 'Printer unreachable.')}</div>`;
        return;
      }

      const isPrinting = cls === 'printing';
      if (!isPrinting && !d.file) {
        body.innerHTML = `<div class="idle">No active print job.</div>${buildTemps(d)}`;
        return;
      }

      const progress = Math.max(0, Math.min(100, Number(d.progress) || 0));
      body.innerHTML = `
        ${d.file ? `<div class="job" title="${escapeHtml(d.file)}">${escapeHtml(d.file)}</div>` : ''}
        <div class="progress-head"><span class="section-label">Progress</span><span class="percent">${progress.toFixed(1)} %</span></div>
        <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><div class="fill" style="width:${progress}%"></div></div>
        ${d.layer_current != null && d.layer_total != null ? `<div class="layer">Layer ${escapeHtml(d.layer_current)} / ${escapeHtml(d.layer_total)}</div>` : ''}
        <div class="stats">
          <div class="stat"><div class="stat-label">Remaining</div><div class="stat-value">${escapeHtml(d.time_remaining || '–')}</div></div>
          <div class="stat"><div class="stat-label">Elapsed</div><div class="stat-value">${escapeHtml(d.time_elapsed || '–')}</div></div>
        </div>
        ${buildTemps(d)}`;
    }

    async function toggleLed(id) {
      const btn = byId(`ledBtn-${id}`);
      if (!btn || btn.disabled) return;
      const turnOn = !Boolean(ledStates[id]);
      btn.disabled = true;
      try {
        const response = await fetch(`/api/led/${encodeURIComponent(id)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ on: turnOn })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'Could not switch the LED.');
        ledStates[id] = turnOn;
        btn.classList.toggle('on', turnOn);
        btn.textContent = turnOn ? 'LED on' : 'LED';
      } catch (error) {
        console.error(error);
        btn.title = error.message;
      } finally {
        btn.disabled = false;
      }
    }

    function toggleCamera(id, url, name) {
      const panel = byId(`camPanel-${id}`);
      const button = byId(`camToggle-${id}`);
      if (!panel || !button) return;
      if (cameraOpen[id]) {
        panel.classList.remove('open');
        panel.innerHTML = '';
        cameraOpen[id] = false;
        button.setAttribute('aria-expanded', 'false');
        button.lastElementChild.textContent = 'Open +';
        return;
      }
      // URLs are configured by the owner; escape values before inserting them into markup.
      const safeUrl = escapeHtml(url);
      panel.innerHTML = `<img src="${safeUrl}" alt="${escapeHtml(name)} Camerastream"
        onerror="this.style.display='none'; this.insertAdjacentHTML('afterend','<p class=&quot;camera-foot&quot;>Camera stream unavailable.</p>')">
        <div class="camera-foot"><span>${escapeHtml(name)} · Live feed</span><a href="${safeUrl}" target="_blank" rel="noopener noreferrer">Open in new tab ↗</a></div>`;
      panel.classList.add('open');
      cameraOpen[id] = true;
      button.setAttribute('aria-expanded', 'true');
      button.lastElementChild.textContent = 'Close −';
    }

    async function refresh() {
      if (refreshInProgress) return;
      refreshInProgress = true;
      const btn = byId('refreshBtn');
      btn.disabled = true;
      try {
        const response = await fetch('/api/status', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error(data.error || 'Ungültige Statusantwort');
        data.forEach(renderCard);
        byId('lastUpdate').textContent = new Date().toLocaleTimeString('de-DE');
      } catch (error) {
        console.error('Status konnte nicht geladen werden:', error);
      } finally {
        btn.disabled = false;
        refreshInProgress = false;
        resetCountdown();
      }
    }

    function resetCountdown() {
      clearInterval(countdownTimer);
      countdown = 30;
      byId('countdown').textContent = countdown;
      countdownTimer = setInterval(() => {
        countdown -= 1;
        byId('countdown').textContent = countdown;
        if (countdown <= 0) refresh();
      }, 1000);
    }

    printerConfig.forEach(printer => {
      const led = byId(`ledBtn-${printer.id}`);
      if (led) led.addEventListener('click', () => toggleLed(printer.id));
      const cameraButton = byId(`camToggle-${printer.id}`);
      if (cameraButton) {
        cameraButton.addEventListener('click', () => toggleCamera(printer.id, printer.camera_url, printer.name));
      }
    });
    byId('refreshBtn').addEventListener('click', refresh);
    refresh();
    resetCountdown();
  </script>
</body>
</html>
